<svg viewBox="0 0 580 366" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two bands. In the top band, three small panels of axes sit side by side. In the first, two lines of different slopes cross at a single marked point, labelled one solution. In the second, two lines of equal slope run parallel and never meet, labelled no solution. In the third, a dashed line lies directly over a thicker line so the two read as one line, labelled infinitely many. Below a hairline, a row of sampled points sits under each panel, gold where a point lies on both lines and grey where it does not. One point is gold under the first panel, none under the second, and every point is gold under the third." font-family="Space Grotesk, sans-serif"><path fill="none" stroke-width="0.05" stroke-linecap="butt" stroke-linejoin="miter" stroke="#475569" d="M -6.045 1.75 C -4.951 1.75 -3.856 1.75 -2.761 1.75 " transform="matrix(44, 0, 0, -44, 290, 183)"/>
