<svg viewBox="0 0 580 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two solution ladders side by side, separated by a vertical hairline. Both start from a x plus b compared with c, and both subtract b in the middle step, which leaves the direction alone. The left ladder is headed divide by a and its last step divides by a positive number, so the greater-than symbol is unchanged. The right ladder is headed divide by minus a and its last step divides by a negative number, so the symbol reverses to less-than and is highlighted in gold. The two ladders differ only in the sign of the divisor and in that final symbol." font-family="Space Grotesk, sans-serif"><path fill="none" stroke-width="0.02" stroke-linecap="butt" stroke-linejoin="miter" stroke="#e4e9f1" d="M 0 2.4 C 0 0.813359 0 -0.773359 0 -2.36 " transform="matrix(50, 0, 0, -50, 290, 150)"/>
