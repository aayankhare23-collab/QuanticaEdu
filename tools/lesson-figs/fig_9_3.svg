<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The cross diagram for checking one factoring candidate. The terms p x and q sit in a top row, r x and s below them. The left column's product p r gives the leading coefficient a, the right column's product q s gives the constant c, and two gold diagonal strokes cross in the middle, the cross products p s and q r, whose sum must give the middle coefficient b. The columns hold by construction and the middle is where a candidate passes or fails." font-family="Space Grotesk, sans-serif"><path fill="none" stroke-width="0.03" stroke-linecap="butt" stroke-linejoin="miter" stroke="#0a0a0a" d="M -2.24 1 C -2.24 0.626641 -2.24 0.253359 -2.24 -0.12 " transform="matrix(50, 0, 0, -50, 290, 160)"/>
<path fill="none" stroke-width="0.03" stroke-linecap="butt" stroke-linejoin="miter" stroke="#0a0a0a" d="M 2.24 1 C 2.24 0.626641 2.24 0.253359 2.24 -0.12 " transform="matrix(50, 0, 0, -50, 290, 160)"/>
<path fill="none" stroke-width="0.052" stroke-linecap="butt" stroke-linejoin="miter" stroke="#ffc84d" d="M -1.64 1.16 C -0.493359 0.666641 0.653359 0.173359 1.8 -0.32 " transform="matrix(50, 0, 0, -50, 290, 160)"/>
<path fill="none" stroke-width="0.052" stroke-linecap="butt" stroke-linejoin="miter" stroke="#ffc84d" d="M -1.64 -0.28 C -0.493359 0.213359 0.653359 0.706641 1.8 1.2 " transform="matrix(50, 0, 0, -50, 290, 160)"/>
<path fill="none" stroke-width="0.052" stroke-linecap="butt" stroke-linejoin="miter" stroke="#ffc84d" d="M -1.24 -2.7 C -0.413359 -2.7 0.413359 -2.7 1.24 -2.7 " transform="matrix(50, 0, 0, -50, 290, 160)"/><text x="178.0" y="84.0" font-size="27" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">px</text><text x="402.0" y="84.0" font-size="27" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">q</text><text x="178.0" y="192.0" font-size="27" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">rx</text><text x="402.0" y="192.0" font-size="27" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">s</text><text x="290.0" y="84.0" font-size="20" font-weight="500" fill="#5b6b7a" text-anchor="middle" dominant-baseline="middle">+</text><text x="290.0" y="192.0" font-size="20" font-weight="500" fill="#5b6b7a" text-anchor="middle" dominant-baseline="middle">+</text><text x="178.0" y="240.0" font-size="17" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">pr = a</text><text x="402.0" y="240.0" font-size="17" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">qs = c</text><text x="290.0" y="278.0" font-size="18" font-weight="700" fill="#0a0a0a" text-anchor="middle" dominant-baseline="middle" font-style="italic">ps + qr = b</text></svg>