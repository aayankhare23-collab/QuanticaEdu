<!doctype html><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#f7f9fc;margin:0;padding:28px;}
figure{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:22px 20px 16px;max-width:640px;margin:0 auto 26px;}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:14px;color:#475569;margin-top:12px;line-height:1.5}
h2{font-size:15px;color:#94a3b8;font-weight:500;max-width:640px;margin:0 auto 8px}
</style>
<div id="out"></div>
<script>
const files=new URLSearchParams(location.search).get('f')?.split(',')||['fig_7_1'];
(async()=>{for(const n of files){const t=await (await fetch(n+'.svg')).text();
document.getElementById('out').insertAdjacentHTML('beforeend','<h2>'+n+'</h2><figure>'+t+'</figure>');}})();
</script>
